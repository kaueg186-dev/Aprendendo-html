        /* Exemplo de link como botão */
        a:link, a:visited {
            background-color: cornflowerblue;
            padding: 30px 80px;
            color: rgb(14, 12, 12);
            text-decoration: none;
            font-family: sans-serif;
            font-weight: bold;
            border: 4px solid black;
            display: inline-block;
        }
        a:hover, a:active {
       background-color: whitesmoke;
       padding: 30px 80px;
       color: azure;
       font-family: sans-serif;
       font-weight: bold;
       display: inline-block;
       transition: .5s;
        }
    </style>
