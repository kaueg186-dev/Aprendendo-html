<!DOCTYPE html>
<html lang="pt-br">
<head>
   <style>
    ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: darkgray;
    }

    li{
        float: left;
    }

    li a {
        display: block;
        color: rgb(30, 28, 28);
        text-align: center;
        padding: 16px;
        text-decoration: none;
        font-family: sans-serif;
    }

    li a:hover {
        color: darkblue;
        background-color: rgb(49, 161, 235);
        transition: 0.8;
    }
   </style>
    <title>Aula 09 HTML</title>
</head>
<!--Exemplo um layout de menu para navegação -->
    
<h2>Criando um layout de menu para navegação</h2>

<ul>
    <li><a href="#home">Home</a></li>
    <li><a href="#sobre">Sobre</a></li>
    <li><a href="#produtos">Produtos</a></li>
    <li><a href="#contatos">Contatos</a></li>
</ul>
</body>
</html>
