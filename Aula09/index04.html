<!DOCTYPE html>
<html lang="pt-br">

<head>

    <title>Aula 09</title>
</head>

<body>
    <!-- Listas ordenadas  -->

    <h2>Trabalhando com listas não ordenadas</h2>
    <!-- exemplos de marcadores de lista não ordenada -->

    <ul style="list-style-type: disc;">
        <li>Laranja</li>
        <li>Manga</li>
        <li>Melão</li>
    </ul>
    <hr>

    <ul style="list-style-type: circle;">
        <li>Café</li>
        <li>Suco</li>
        <li>Àgua</li>
    </ul>
    <hr>

    <ul style="list-style-type: square;">
        <li>10</li>
        <li>40</li>
        <li>70</li>
    </ul>

    <hr>

    <ul style="list-style-type: none;">
        <li>Moto</li>
        <li>Carro</li>
        <li>Caminhão</li>
    </ul>
    <hr>

    <!-- Exemplos de listas não ordenadas aninhadas -->

    <h2>Listas aninhadas</h2>

    <ul>
        <li>Laranja</li>
        <li>maçã</li>
        <li>Banana</li>
        <ul>
            <li>Carro</li>
            <li>moto</li>
            <li>barco</li>
        </ul>
        <li>Melão</li>
        <li>Uva</li>
    </ul>

    <hr>

    

    
</body>

</html>
