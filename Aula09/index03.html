<!DOCTYPE html>
<html lang="pt-br">
<head>
   
    <title>Aula 09</title>
</head>
<body>
    <!-- definindo lista não ordenada no HTML -->
     <h2>Exemplo de lista ordenada em html (tag ul)</h2>

     <ul>
        <li>Laranja</li>
        <li>Morango</li>
        <li>Uva</li>
     </ul>
     <!-- Definindo lista ordenada em html (tag ol) -->
<hr>
     <ol>
        <li>Tangerina</li>
        <li>pessego</li>
        <li>Melancia</li>
     </ol>
<hr>
     <!-- Definindo lista descritiva no HTMl -->
      <h2>Exemplo de lista descritiva em HTML (tal dl)</h2>

      <dl>
        <dt>Café</dt>
        <dd>Bebida quente</dd>
        <dt>suco</dt>
        <dd>Bebida fria</dd>
      </dl>

</body>
</html>
