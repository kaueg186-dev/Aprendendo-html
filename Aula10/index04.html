<!DOCTYPE html>
<html lang="pt-br">
<head>
   <style>
    .teste-btn {
        background-color: darkblue;
        border: none;
        font-size: 22px;
        padding: 12px;
        border-radius: 2px;
        cursor: pointer;
    }
    .teste-btn:hover{
        background-color: blue;
    }
   </style>
    <title>Aula 10 HTML</title>
</head>
<body>
    <!-- Utilizando botões no HTML -->

    <h2>Exemplo de botão</h2>

    <h2>Alterando estilo de botão</h2>
    <button class="teste-btn">Clique aqui</button>
</body>
</html>
